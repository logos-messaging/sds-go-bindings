name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master, release/*]
  workflow_dispatch:
    inputs:
      nim-sds-ref:
        description: 'nim-sds ref to build libsds from (default: the pin in sds_go_bindings.nimble)'
        default: ''

env:
  NIM_SDS_REF: ${{ github.event.inputs.nim-sds-ref || '' }}
  GO_VERSION: '1.24'
  # 2.2.4 ships nimble 0.18.2, whose resolver cannot reconcile the taskpools
  # constraint nim-sds carries for nim-ffi.
  NIM_VERSION: '2.2.10'

jobs:
  build-test-lint:
    name: 'go / ubuntu-latest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Override the nim-sds pin
        if: ${{ env.NIM_SDS_REF != '' }}
        run: |
          sed -i "s|\(nim-sds\)#[^\"]*|\1#${NIM_SDS_REF}|" sds_go_bindings.nimble
          grep nim-sds sds_go_bindings.nimble

      - name: Build libsds
        # Through the Nimble package, the same path a consumer takes.
        run: |
          make deps
          make libsds
          echo "CGO_CFLAGS=-I$PWD/build" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$PWD/build -lsds -Wl,-rpath,$PWD/build" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

      - name: Build lint stubs
        run: go build -tags lint ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@v8
        if: ${{ !cancelled() }}
        with:
          version: v2.4.0
