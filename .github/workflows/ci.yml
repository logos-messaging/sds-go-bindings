name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master, release/*]
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  NIM_VERSION: '2.2.6'

jobs:
  build-test-lint:
    name: 'go / ubuntu-latest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      # The Nimble bundled with Nim hashes packages differently and cannot
      # verify this lock file. nightly is also what nim-sds resolves with.
      - uses: nim-lang/setup-nimble-action@v1
        with:
          nimble-version: 'nightly'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build libsds
        # Through the Nimble package, the same path a consumer takes.
        run: |
          make deps
          make libsds
          echo "CGO_CFLAGS=-I$PWD/build" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$PWD/build -lsds -Wl,-rpath,$PWD/build" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

      - name: Build lint stubs
        run: go build -tags lint ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@v8
        if: ${{ !cancelled() }}
        with:
          version: v2.4.0
