name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master, release/*]
  workflow_dispatch:
    inputs:
      nim-sds-ref:
        description: 'nim-sds ref to build libsds from (default: the pin in sds_go_bindings.nimble)'
        default: ''

env:
  NIM_SDS_REF: ${{ github.event.inputs.nim-sds-ref || '' }}
  GO_VERSION: '1.24'
  NIM_VERSION: '2.2.4'
  # The nimble bundled with 2.2.4 is 0.18.2, which hashes packages differently
  # and so cannot verify a lock file written by 0.22.x.
  NIMBLE_VERSION: '0.22.2'

jobs:
  build-test-lint:
    name: 'go / ubuntu-latest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Install nimble ${{ env.NIMBLE_VERSION }}
        run: |
          curl -fsSL -o /tmp/nimble.tar.gz \
            "https://github.com/nim-lang/nimble/releases/download/v${NIMBLE_VERSION}/nimble-linux_x64.tar.gz"
          mkdir -p "$HOME/.nimble/bin"
          tar -xzf /tmp/nimble.tar.gz -C "$HOME/.nimble/bin"
          chmod +x "$HOME/.nimble/bin/nimble"
          nimble --version | head -2

      - name: Override the nim-sds pin
        if: ${{ env.NIM_SDS_REF != '' }}
        run: |
          sed -i "s|\(nim-sds\)#[^\"]*|\1#${NIM_SDS_REF}|" sds_go_bindings.nimble
          grep nim-sds sds_go_bindings.nimble

      - name: Build libsds
        # Through the Nimble package, the same path a consumer takes.
        run: |
          make deps
          make libsds
          echo "CGO_CFLAGS=-I$PWD/build" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$PWD/build -lsds -Wl,-rpath,$PWD/build" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

      - name: Build lint stubs
        run: go build -tags lint ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@v8
        if: ${{ !cancelled() }}
        with:
          version: v2.4.0
