name: ci

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master, release/*]
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  NIM_VERSION: '2.2.6'
  # Nimble master. The Nimble bundled with Nim hashes packages differently and
  # cannot verify this lock file, and no release yet carries the lock-file
  # fixes nim-lang/nimble#1833 and #1838 that a URL require needs.
  NIMBLE_COMMIT: '07caee397d628c9e93d81048268365c4c2414a80'

jobs:
  build-test-lint:
    name: 'go / ubuntu-latest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      # Built rather than downloaded: the prebuilt binaries live under a rolling
      # 'latest' tag, which no action input can pin to a commit.
      - name: Install Nimble
        run: |
          git clone --filter=blob:none https://github.com/nim-lang/nimble /tmp/nimble
          git -C /tmp/nimble checkout --detach "$NIMBLE_COMMIT"
          git -C /tmp/nimble submodule update --init --recursive
          mkdir -p "$HOME/.nimble/bin"
          nim c -d:release --outdir:"$HOME/.nimble/bin" /tmp/nimble/src/nimble.nim
          nimble --version | tail -2

      - name: Build libsds
        # Through the Nimble package, the same path a consumer takes.
        run: |
          make deps
          make libsds
          echo "CGO_CFLAGS=-I$PWD/build" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$PWD/build -lsds -Wl,-rpath,$PWD/build" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build ./...

      - name: Build lint stubs
        run: go build -tags lint ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@v8
        if: ${{ !cancelled() }}
        with:
          version: v2.4.0
